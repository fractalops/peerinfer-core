[workspace]
resolver = "3"
members = ["crates/core", "crates/bench", "crates/web"]
default-members = ["crates/core", "crates/bench"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fractalops/peerinfer-core"

[workspace.dependencies]
peerinfer-core = { path = "crates/core" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
pollster = "0.4"
futures-channel = "0.3"
